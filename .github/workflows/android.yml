
name: Build Rocma Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Rocma-MBN-212.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
           packages: platform-tools

      - name: Unzip Android project
        run: |
          unzip -o Rocma-MBN-212.zip -d project
          find project -name settings.gradle -exec dirname {} \; > project_path.txt
          PROJECT_DIR="$(head -n 1 project_path.txt)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Rocma-MBN-20-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
